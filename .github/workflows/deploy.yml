name: Deploy SilaBiblia Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 3. Obtener Dependencias
        run: flutter pub get

      - name: 4. Compilar Flutter Web (Release Mode)
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          touch build/web/.nojekyll
          cp web/index.html build/web/preview.html || true

      - name: 5. Desplegar en la rama gh-pages (peaceiris/actions-gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

      - name: 6. Configurar Artifact GitHub Pages Oficial
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: 7. Desplegar en GitHub Pages Oficial
        id: deployment
        uses: actions/deploy-pages@v4
